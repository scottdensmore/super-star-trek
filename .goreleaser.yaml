# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: super-star-trek

before:
  hooks:
    - go mod tidy

builds:
  - id: sst
    main: ./cmd/sst
    binary: sst
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

universal_binaries:
  - id: sst
    replace: false
    name_template: sst

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      - c/sst.doc

nfpms:
  - id: packages
    package_name: super-star-trek
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Scott Densmore
    homepage: https://github.com/scottdensmore/super-star-trek
    maintainer: Scott Densmore <scottdensmore@users.noreply.github.com>
    description: Authentic modernized Super Star Trek with Bubbletea TUI and retro audio
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/super-star-trek/README.md
      - src: c/sst.doc
        dst: /usr/share/doc/super-star-trek/sst.doc

brews:
  - repository:
      owner: scottdensmore
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/scottdensmore/super-star-trek
    description: Authentic modernized Super Star Trek with Bubbletea TUI and retro audio
    license: MIT
    test: |
      system "#{bin}/sst", "--version"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
