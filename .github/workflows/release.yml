name: Release

# Private repos pay for Actions minutes (macOS 10x, Windows 2x Linux), so the
# release matrix runs only on v* tags or a manual dispatch. A tag push (or a
# dispatch run on a tag) publishes a GitHub Release; a dispatch run on a
# branch only builds the archives and keeps them as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        run: |
          cargo_version="$(awk '/^\[workspace.package\]/ { f = 1; next } /^\[/ { f = 0 } f && /^version *=/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "::error::could not read the workspace version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the Cargo workspace version $cargo_version" >&2
              exit 1
            fi
          else
            version="$cargo_version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run test suite (incl. parity transcripts)
        run: cargo test --workspace --release --locked

  build:
    name: Package (${{ matrix.artifact }})
    needs: [version, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            smoke: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            smoke: true
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            smoke: true
            linux_packages: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            smoke: true
            linux_packages: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            smoke: true
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-aarch64
            smoke: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          SST_VERSION="$VERSION" \
          SST_COMMIT="${GITHUB_SHA::7}" \
          SST_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            cargo build --release --locked -p super-star-trek --bin sst --target "$TARGET"

      - name: Smoke test the binary
        if: matrix.smoke
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          out="$("target/$TARGET/release/sst$suffix" --version)"
          echo "$out"
          case "$out" in
            "sst version $VERSION "*) ;;
            *) echo "::error::unexpected --version output: $out" >&2; exit 1 ;;
          esac
          "target/$TARGET/release/sst$suffix" --classic --seed 7

      - name: Package release archive
        shell: bash
        run: bash scripts/package-release.sh "$TARGET" "$VERSION" dist

      - name: Build .deb and .rpm packages
        if: matrix.linux_packages
        shell: bash
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          name="super-star-trek-$VERSION-${{ matrix.artifact }}"
          deb="$(cargo deb -p super-star-trek --no-build --no-strip --target "$TARGET" \
            --deb-version "$VERSION" --output "dist/$name.deb" | tail -n 1)"
          echo "Built $deb"
          cargo generate-rpm -p crates/sst --target "$TARGET" \
            --set-metadata "version = \"$VERSION\"" --output "dist/$name.rpm"
          (cd dist && for f in "$name.deb" "$name.rpm"; do sha256sum "$f" > "$f.sha256"; done)
          ls -l dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: super-star-trek-${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: error
          path: dist/*

  wasm:
    name: Package (wasm)
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wasm32

      - name: Install wasm-bindgen CLI
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Package WebAssembly bundle
        run: |
          bash scripts/package-wasm.sh "$VERSION" build/dist
          mkdir -p dist
          for ext in tar.gz zip; do
            name="super-star-trek-$VERSION-wasm.$ext"
            mv "build/dist/super-star-trek_${VERSION}_wasm.$ext" "dist/$name"
            (cd dist && sha256sum "$name" > "$name.sha256")
          done
          ls -l dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: super-star-trek-wasm
          retention-days: 7
          if-no-files-found: error
          path: dist/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: super-star-trek-*
          path: dist
          merge-multiple: true

      - name: Write combined checksums
        run: |
          cd dist
          rm -f ./*.sha256
          sha256sum super-star-trek-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "Super Star Trek $VERSION" \
              --generate-notes
          fi
