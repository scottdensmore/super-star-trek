name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Preset names rather than build types, because the preset is what
      # this job actually runs. A matrix of build types would have to be
      # mapped back to a preset in three separate steps, which is the
      # kind of restatement CMakePresets.json exists to remove.
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [ci-debug, ci-release]

    steps:
      - uses: actions/checkout@v4

      # tmux gives tests/tui.sh the pty that curses needs. Without it
      # that test reports SKIPPED and the job still goes green, so the
      # only coverage of the full-screen display would quietly be none.
      #
      # Bounded and retried, because an unguarded install can take the
      # whole job with it. Measured on #185: apt-get update hung on
      # ubuntu-latest and the job's 15 minutes ran out inside this step,
      # across three job re-runs -- Configure, Build and Test all skipped,
      # nothing compiled, and the check reporting `cancelled`, which is
      # also what GitHub says when a human presses the button or when
      # the concurrency group above fires. It took a per-step API query
      # to find out the runner had simply failed to install tmux. #186.
      #
      # timeout(1) is what does the work, not the loop. A hang never
      # returns, so a retry alone never gets a second attempt: measured,
      # a three-pass loop around a hanging command makes exactly one.
      #
      # The warning names the command and reads its status, because the
      # complaint that started this was that a red log did not say what
      # had gone wrong: 124 is the bound firing, 137 the -k after it,
      # anything else apt's own failure. `cmd || rc=$?` rather than an
      # if around the command, for two reasons: $? after a closed if is
      # the *statement's* status, not the command's, so a first draft
      # reported every install failure as "status 0" -- caught by its
      # own test -- and a bare failing command would trip the errexit
      # the runner's default `bash -e {0}` turns on, where a || list
      # does not.
      #
      # timeout goes *inside* sudo so that it runs as root and apt-get
      # is its direct child. Outside, it is an unprivileged process
      # signalling a root one: the kill fails, the sudo front end dies
      # at the bound, and the root apt-get survives orphaned holding
      # /var/lib/apt/lists/lock -- measured, still running four seconds
      # later -- so the next attempt fails on the lock rather than
      # retrying the fetch. That way round also makes -k load-bearing,
      # since apt mid-transaction can outlive a TERM.
      #
      # timeout-minutes on the step as well: it backstops anything that
      # outlives its own bound, and a step that fails on its own timeout
      # keeps its log, where a job killed by the job timeout does not.
      # 7 rather than 8 because the two budgets add only on success -- a
      # failed install skips Configure, Build and Test -- so an install
      # that succeeds slowly must still leave room for ctest, which the
      # runners themselves put at 333s and 325s on ubuntu-latest for
      # the two presets, on the run that merged #185. The actionlint
      # step below adds to that on success: at most 20 + 5 + 3 twice
      # over and then a 20 that works, so 76s. Worst successful case is
      # then about 420 + 76 + 340 + a build measured at 3s here, so
      # 839 of the job's 900 -- the margin was ~140s before that step
      # and is ~61s with it. Only successes add, a failed step skipping
      # the rest, which is why the step caps are not in this sum.
      #
      # Two terms that sum leaves out, said plainly because ~61s is thin
      # enough that they matter where ~140s was not: actions/checkout
      # and Configure both count against the job and neither is
      # measured here, and the 340s for ctest was read off a run that
      # predates the workflow test this change adds -- a test that takes
      # 0.1s locally, but is one more thing in that number. If this gets
      # tight the job cap is the thing to raise; it is 15 minutes
      # against a runner that gives 6 hours.
      #
      # The budget, corrected twice and so stated exactly. The install
      # runs only if the update returned inside its bound, so the two
      # bounds are alternatives rather than a sum: an attempt is at most
      # max(70, 60 + 130) = 190s counting the -k grace. The sleep is
      # unconditional, so three attempts cost at most 3 x 190 + 3 x 5 =
      # 585s, which the 420s cap truncates. Attempts 1 and 2 with their
      # sleeps are at most 390s, so the third always starts -- with as
      # little as 30s left of the cap against the 190 it may want, so
      # starting is not the same as finishing. In the mode observed on
      # #185 (update hangs, install never reached) an attempt plus its
      # sleep costs 65s if apt dies to the TERM and 75s if it needs the
      # -k grace -- which of the two that apt would have done was never
      # observed, nothing having signalled it -- so all three fit in
      # 225s either way.
      #
      # 60s on the update is the one bound that could fail a healthy
      # run: apt's own per-connection timeout defaults to 120s, so a
      # stalled mirror that would eventually have answered can exceed
      # it. Kept, because three attempts cover the transient case and
      # #185 cost three whole jobs. Two limits not fixed here: a bound
      # that fires can leave dpkg mid-transaction, which is not worth
      # recovering on a runner thrown away at the end of the job, and
      # the && means an update that stays broken fails the step even
      # where the cached lists would have let install succeed.
      #
      # shellcheck is here for the workflow lint below, not for the
      # build. actionlint's shell checks are opt-out by absence: without
      # that binary it lints the schema, says nothing about any run:
      # body, and still exits 0. tests/workflow.sh refuses to pass on
      # that -- a hard failure on Linux CI -- so leaving it to whatever
      # the runner image ships would make both Linux legs depend on an
      # image detail nothing here states. GitHub's ubuntu images do ship
      # it today; naming it means the day they stop is a slow install
      # rather than a red leg. It is in this list rather than in a step
      # of its own because it costs one more package on a fetch that is
      # already happening.
      - name: Install ncurses, tmux and shellcheck
        if: runner.os == 'Linux'
        timeout-minutes: 7
        run: |
          for attempt in 1 2 3; do
            rc=0
            sudo timeout -k 10 60 apt-get update || rc=$?
            if [ "$rc" -eq 0 ]; then
              what="apt-get install"
              sudo timeout -k 10 120 apt-get install -y \
                --no-install-recommends libncurses-dev tmux \
                shellcheck || rc=$?
              if [ "$rc" -eq 0 ]; then
                exit 0
              fi
            else
              what="apt-get update"
            fi
            case $rc in
              124) why="timed out at its bound" ;;
              137) why="ignored the bound and was killed" ;;
              *)   why="failed with status $rc" ;;
            esac
            echo "::warning::attempt $attempt: $what $why" >&2
            sleep 5
          done
          echo "::error::could not install libncurses-dev, tmux" \
            "and shellcheck" >&2
          exit 1

      # No timeout here, deliberately: it is GNU coreutils and the macOS
      # runners do not have it. This repository already knew that --
      # CMakeLists.txt says so where it sets a CTest TIMEOUT, and five
      # scripts under tests/ guard the call with command -v -- and a
      # first draft of this change called it unguarded on this step,
      # which would have failed both macOS legs deterministically: the
      # two the bug never touched. So the step cap is the whole of the
      # bound here, and the loop covers a brew that fails rather than
      # one that wedges. The brew list fast path never fires on a hosted
      # runner -- the last green macOS job installed tmux -- and is kept
      # for a self-hosted or local one, where reinstalling every run
      # would be the waste it looks like.
      - name: Install tmux
        if: runner.os == 'macOS'
        timeout-minutes: 7
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew list tmux >/dev/null 2>&1 && exit 0
          for attempt in 1 2 3; do
            if brew install tmux; then
              exit 0
            fi
            echo "::warning::brew attempt $attempt failed" >&2
            sleep 5
          done
          echo "::error::could not install tmux" >&2
          exit 1

      # actionlint lints the workflow itself -- the shell in every run:
      # body, the schema, and the expressions. Linux only: the workflow
      # content is the same whatever runner reads it, so linting it on
      # the two Linux legs covers it. tests/workflow.sh skips where the
      # tool is absent -- macOS, and a developer's machine -- and fails
      # where CI is set and the platform is Linux, so a leg that meant
      # to lint and could not is loud rather than green. That asymmetry
      # is deliberate and is what stops this repeating #186's macOS
      # mistake, where a step needed a tool that platform does not have.
      #
      # It takes two tools, and both are installed on the Linux legs:
      # actionlint by this step, shellcheck with the build dependencies
      # further up. actionlint without shellcheck is the quiet
      # half-lint -- schema checked, every run: body ignored, exit 0 --
      # which is the failure the hard-fail above exists to catch, so
      # leaving the second to whatever the runner image ships would
      # aim that check at ourselves.
      #
      # Pinned, and checked. An unpinned "latest" would make every run
      # depend on whatever was released this morning, and a lint that
      # changes under you is worse than no lint. The checksum is the
      # release's own; a download that does not match it is a failure
      # rather than something to run.
      #
      # Bounded and retried like the installs above, and for the reason
      # #186 records: an unguarded fetch can take the whole job. 20s on
      # the curl is about 150x what the fetch wants -- the artifact is
      # 2.3 MB and came down in ~0.13s when measured on this branch --
      # so it is a hang guard, not a speed limit. The other half of that
      # number is load-bearing and invisible: 3 x (20 + 5 + 3) = 84s is
      # the worst failing case, and it fits inside this step's own
      # timeout-minutes: 2, which is what lets the ::error:: below
      # actually print. Raise the 20 without raising the 2 and the step
      # cap cuts off the message that says what went wrong.
      - name: Install actionlint
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # In RUNNER_TEMP rather than the checkout: the tarball and the
          # extracted binary would otherwise sit at the repo root for
          # Configure, Build and Test. Nothing today notices -- there is
          # no file(GLOB) in CMakeLists.txt and the one test that walks
          # the tree, tests/instructions.sh, matches CLAUDE*.md -- so
          # this is keeping the workspace as checked out, not a fix.
          cd "$RUNNER_TEMP"
          url=https://github.com/rhysd/actionlint/releases/download
          tgz=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          for attempt in 1 2 3; do
            rc=0
            timeout -k 5 20 curl -sSLf -o "$tgz" \
              "$url/v${ACTIONLINT_VERSION}/$tgz" || rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            case $rc in
              124) why="timed out at its bound" ;;
              137) why="ignored the bound and was killed" ;;
              *)   why="failed with status $rc" ;;
            esac
            echo "::warning::attempt $attempt: actionlint download $why" >&2
            sleep 3
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::could not download actionlint" >&2
            exit 1
          fi
          echo "${ACTIONLINT_SHA256}  $tgz" | sha256sum -c -
          tar xzf "$tgz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      # Every flag these steps would otherwise spell out lives in
      # CMakePresets.json instead: the build type, -Werror via SST_WERROR,
      # and ctest's --output-on-failure and --no-tests=error. Anyone can
      # now run exactly what CI runs with the same three commands, which
      # was not true while this file was one of five writing the recipe
      # down. Three of those five were identical. Only this file carried
      # SST_WERROR, and the verifier's brief -- the pass that stands
      # between a change and CI -- omitted it where the omission
      # mattered, so the one build meant to predict CI was the one that
      # could not.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
