name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Run test suite (incl. Go parity transcripts)
        run: cargo test --workspace --release --locked

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install wasm-bindgen CLI
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Run clippy for wasm32
        run: cargo clippy -p sst-wasm --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Build web bundle and run WebAssembly journeys
        run: bash scripts/test-wasm-journeys.sh

  c-matrix:
    name: c-matrix (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [ci-debug, ci-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies, tmux and shellcheck
        if: runner.os == 'Linux'
        timeout-minutes: 7
        run: |
          for attempt in 1 2 3; do
            rc=0
            sudo timeout -k 10 60 apt-get update || rc=$?
            if [ "$rc" -eq 0 ]; then
              what="apt-get install"
              sudo timeout -k 10 120 apt-get install -y \
                --no-install-recommends libncurses-dev tmux \
                shellcheck || rc=$?
              if [ "$rc" -eq 0 ]; then
                exit 0
              fi
            else
              what="apt-get update"
            fi
            case $rc in
              124) why="timed out at its bound" ;;
              137) why="ignored the bound and was killed" ;;
              *)   why="failed with status $rc" ;;
            esac
            echo "::warning::attempt $attempt: $what $why" >&2
            sleep 5
          done
          echo "::error::could not install libncurses-dev, tmux and shellcheck" >&2
          exit 1

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        timeout-minutes: 7
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew list tmux >/dev/null 2>&1 && exit 0
          for attempt in 1 2 3; do
            if brew install tmux; then
              exit 0
            fi
            echo "::warning::brew attempt $attempt failed" >&2
            sleep 5
          done
          echo "::error::could not install tmux" >&2
          exit 1

      - name: Install actionlint
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "$RUNNER_TEMP"
          url=https://github.com/rhysd/actionlint/releases/download
          tgz=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          for attempt in 1 2 3; do
            rc=0
            timeout -k 5 20 curl -sSLf -o "$tgz" \
              "$url/v${ACTIONLINT_VERSION}/$tgz" || rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            case $rc in
              124) why="timed out at its bound" ;;
              137) why="ignored the bound and was killed" ;;
              *)   why="failed with status $rc" ;;
            esac
            echo "::warning::attempt $attempt: actionlint download $why" >&2
            sleep 3
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::could not download actionlint" >&2
            exit 1
          fi
          echo "${ACTIONLINT_SHA256}  $tgz" | sha256sum -c -
          tar xzf "$tgz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build C engine with -Werror
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run CTest test suite
        run: ctest --preset ${{ matrix.preset }}

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - rust
      - wasm
      - c-matrix
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          success=true
          for result in \
            "${{ needs.rust.result }}" \
            "${{ needs.wasm.result }}" \
            "${{ needs.c-matrix.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Job dependency ended with status '$result'"
              success=false
            fi
          done
          if [ "$success" != "true" ]; then
            exit 1
          fi
          echo "All CI jobs passed successfully."
