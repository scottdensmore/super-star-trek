[package]
name = "sst-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sst-engine = { path = "../sst-engine" }
sst-audio = { path = "../sst-audio" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3.107"

[dev-dependencies]
# The browser/terminal parity test drives the console's command handler.
sst-tui = { path = "../sst-tui" }
