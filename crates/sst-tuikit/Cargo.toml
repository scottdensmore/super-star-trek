[package]
name = "sst-tuikit"
description = "Faithful Rust re-implementation of the Charmbracelet subset (lipgloss, termenv, x/ansi, bubbletea, bubbles) used by Super Star Trek"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
unicode-segmentation = "1.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.28", default-features = false, features = ["events", "windows"] }
